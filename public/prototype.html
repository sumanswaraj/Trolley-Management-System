<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Trolley Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#F1F4F7;--card:#FFFFFF;--ink:#15202B;--ink2:#40536A;--mute:#6B7C8D;--line:#DAE1E8;--line2:#ECF0F4;
  --accent:#0F5FA8;--accent-ink:#fff;--amber:#F2A900;--side:#101B26;--side-ink:#B9C6D3;--shadow:0 1px 2px rgba(16,27,38,.06),0 4px 14px rgba(16,27,38,.05);
  --c-avail:#17855A;--c-use:#0F5FA8;--c-transit:#0A8499;--c-wait:#A96A00;--c-maint:#566677;--c-over:#C22B2B;--c-out:#7A3FC4;--c-off:#8795A3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C131A;--card:#131D27;--ink:#E6ECF2;--ink2:#B3C0CD;--mute:#8596A7;--line:#263441;--line2:#1C2833;--accent:#5AA6EA;--accent-ink:#06121D;--side:#0A1118;--shadow:0 1px 2px rgba(0,0,0,.4);
  --c-avail:#3DBE8B;--c-use:#5AA6EA;--c-transit:#34B8CE;--c-wait:#E0A93B;--c-maint:#93A3B3;--c-over:#F26B6B;--c-out:#B58AEA;--c-off:#8795A3}}
:root[data-theme="dark"]{
  --bg:#0C131A;--card:#131D27;--ink:#E6ECF2;--ink2:#B3C0CD;--mute:#8596A7;--line:#263441;--line2:#1C2833;--accent:#5AA6EA;--accent-ink:#06121D;--side:#0A1118;--shadow:0 1px 2px rgba(0,0,0,.4);
  --c-avail:#3DBE8B;--c-use:#5AA6EA;--c-transit:#34B8CE;--c-wait:#E0A93B;--c-maint:#93A3B3;--c-over:#F26B6B;--c-out:#B58AEA;--c-off:#8795A3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}.ic.lg{width:24px;height:24px}
.mono{font-family:var(--mono)}
.muted{color:var(--mute)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);z-index:40;transition:transform .2s}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.brand .mk{width:34px;height:34px;border-radius:9px;background:var(--amber);color:#1b1300;display:grid;place-items:center}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.1}.brand span{font-size:11.5px;color:#8FA1B3}
.nav{padding:6px 10px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;position:relative;margin-bottom:1px;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.09);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.nav .n{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:#C22B2B;color:#fff}
.nav .n.soft{background:rgba(255,255,255,.14)}
.side-f{padding:12px 16px 16px;font-size:11.5px;color:#8FA1B3;border-top:1px solid rgba(255,255,255,.08)}
.side-f .ok{display:flex;align-items:center;gap:7px;color:#cfe;margin-bottom:4px}
.dotg{width:8px;height:8px;border-radius:50%;background:#3DBE8B;box-shadow:0 0 0 3px rgba(61,190,139,.2)}
.main{grid-column:2;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px}
.gsearch{position:relative;flex:1;max-width:420px}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.gsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute)}
.clock{font-size:12.5px;color:var(--ink2);text-align:right;line-height:1.2}.clock b{display:block;font-family:var(--mono);font-size:14px;color:var(--ink)}
.iconbtn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--bg)}
.iconbtn .cnt{position:absolute;top:-5px;right:-5px;background:#C22B2B;color:#fff;font-size:10.5px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.user{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left}
.user .av{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px}
.user b{display:block;font-size:13px;line-height:1.15}.user span{font-size:11.5px;color:var(--mute)}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(10,20,30,.2);min-width:280px;z-index:60;padding:8px;display:none}
.pop.show{display:block}.pop h4{font-size:12px;color:var(--mute);padding:6px 8px;font-weight:500}
.pop .it{display:flex;gap:10px;align-items:center;width:100%;padding:8px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.pop .it:hover,.pop .it.on{background:var(--bg)}
.pop .ni{padding:8px;border-radius:8px;display:flex;gap:9px;font-size:13px}.pop .ni.unread{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.rel{position:relative}
.view{padding:22px;max-width:1500px;width:100%;margin:0 auto}
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:23px}.ph p{margin:3px 0 0;color:var(--mute);max-width:70ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.p:hover{filter:brightness(1.08)}
.btn.d{background:var(--c-over);border-color:var(--c-over);color:#fff}
.btn.g{background:color-mix(in srgb,var(--c-avail) 12%,transparent);border-color:color-mix(in srgb,var(--c-avail) 40%,transparent);color:var(--c-avail)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.ch h3{font-size:15px}.cb{padding:14px 16px 16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.mt{margin-top:16px}
/* workflow */
.steps{display:flex;gap:0;margin-bottom:16px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.step{flex:1;min-width:128px;padding:11px 14px;border-right:1px solid var(--line2);cursor:pointer;position:relative}
.step:last-child{border-right:0}.step:hover{background:var(--bg)}
.step b{display:flex;align-items:center;gap:7px;font-size:13px}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink2);font-size:11px;display:grid;place-items:center;font-weight:600}
.step span{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.step.on{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.step.on i{background:var(--accent);color:var(--accent-ink)}
.step.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amber)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{--c:var(--ink);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:hover{border-color:var(--c)}
.kpi .t{display:flex;align-items:center;justify-content:space-between;color:var(--ink2);font-size:12.5px;font-weight:500}
.kpi .t .ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.kpi .v{font-size:30px;font-weight:600;line-height:1.1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.kpi .bar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden}.kpi .bar i{display:block;height:100%;background:var(--c)}
.kpi .f{font-size:11.5px;color:var(--mute);margin-top:6px}
.kpi.alert .v{color:var(--c-over)}
/* badges */
.bd{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.bd::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.s-avail{--c:var(--c-avail)}.s-use{--c:var(--c-use)}.s-transit{--c:var(--c-transit)}.s-wait{--c:var(--c-wait)}.s-maint{--c:var(--c-maint)}.s-over{--c:var(--c-over)}.s-out{--c:var(--c-out)}.s-off{--c:var(--c-off)}
.p-critical{--c:var(--c-over)}.p-high{--c:#D2601A}.p-medium{--c:var(--c-wait)}.p-low{--c:var(--c-maint)}
.p-critical::before{border-radius:1px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11.5px;background:var(--line2);color:var(--ink2);font-weight:500}
.chip.w{background:color-mix(in srgb,var(--c-wait) 16%,transparent);color:var(--c-wait)}
.chip.r{background:color-mix(in srgb,var(--c-over) 14%,transparent);color:var(--c-over)}
.chip.g{background:color-mix(in srgb,var(--c-avail) 14%,transparent);color:var(--c-avail)}
.tid{font-family:var(--mono);font-weight:600;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.tid:hover{text-decoration:underline}
/* tables */
.tw{overflow:auto;border-top:1px solid var(--line2);margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--c-over)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px 0;align-items:center}
.tools input,.tools select,.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;min-height:38px;width:100%}
.tools input,.tools select{width:auto;min-width:130px}.tools .grow{flex:1;min-width:180px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;color:var(--mute);font-size:12.5px;flex-wrap:wrap}
.empty{padding:34px 16px;text-align:center;color:var(--mute)}
/* forms */
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.fld .hint{font-size:11.5px;color:var(--mute);margin-top:3px}
.fld input:disabled{background:var(--bg)}
.err{color:var(--c-over);font-size:12.5px;margin-top:4px}
/* trolley cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px;padding:14px 16px 4px}
.tc{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--card);--c:var(--c-off);border-top:3px solid var(--c);cursor:pointer}
.tc:hover{box-shadow:var(--shadow)}
.tc .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc .id{font-family:var(--mono);font-weight:600;font-size:16px}
.tc dl{margin:9px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}.tc dt{color:var(--mute)}.tc dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* flow diagram */
.flow{display:flex;align-items:stretch;padding:16px}
.fn{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--card);cursor:pointer;--c:var(--accent);position:relative}
.fn:hover{border-color:var(--c)}
.fn .n{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);font-weight:500}
.fn .n .ic{color:var(--c)}
.fn .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.fn .s{font-size:11.5px;color:var(--mute)}
.fn .lb{height:4px;border-radius:2px;background:var(--line2);margin-top:8px;overflow:hidden}.fn .lb i{display:block;height:100%;background:var(--c)}
.fc{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mute);position:relative}
.fc::before{content:"";position:absolute;left:4px;right:12px;top:50%;border-top:2px dashed var(--line);animation:dash 1.2s linear infinite}
.fc::after{content:"";position:absolute;right:6px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:7px solid var(--line)}
.fc span{position:relative;background:var(--card);padding:0 3px;margin-top:-26px;font-family:var(--mono);font-weight:500;color:var(--ink2)}
@keyframes dash{to{transform:translateX(0)}}
.side-nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px 16px}
.side-nodes .fn{border-style:dashed}
/* plant map */
.plant{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);grid-template-areas:"store prod1 prod2 prod3" "store assy qual maint" "fg pack disp disp"}
.room{border:1px solid var(--line);border-left:4px solid var(--rc,var(--c-avail));border-radius:10px;padding:11px 12px;background:var(--card);cursor:pointer;text-align:left;min-height:118px;display:block;width:100%}
.room:hover{box-shadow:var(--shadow)}.room.sel{outline:2px solid var(--accent);outline-offset:1px}
.room .code{font-family:var(--mono);font-size:11px;color:var(--mute)}.room b{display:block;font-size:13.5px}
.room .ct{display:flex;gap:12px;font-size:12px;color:var(--ink2);margin:6px 0 8px}.room .ct strong{font-size:17px;font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:3px}.dot{width:9px;height:9px;border-radius:2px;background:var(--c)}
.outside{margin-top:12px;border:2px dashed var(--c-out);border-radius:12px;padding:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
/* timeline */
.tl{position:relative;margin:4px 0 0 8px;padding-left:22px;border-left:2px solid var(--line)}
.tl .ev{position:relative;padding:0 0 16px}.tl .ev::before{content:"";position:absolute;left:-30px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.tl .ev.now::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 25%,transparent)}
.tl .ev b{display:block}.tl .ev span{font-size:12px;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}.kv dt{color:var(--mute)}.kv dd{margin:0;min-width:0}
/* scan */
.vf{aspect-ratio:4/3;background:#0B1219;border-radius:12px;position:relative;overflow:hidden;display:grid;place-items:center;color:#7F92A5}
.vf .c{position:absolute;width:34px;height:34px;border:3px solid var(--amber)}
.vf .c.a{left:18%;top:16%;border-right:0;border-bottom:0}.vf .c.b{right:18%;top:16%;border-left:0;border-bottom:0}.vf .c.c2{left:18%;bottom:16%;border-right:0;border-top:0}.vf .c.d{right:18%;bottom:16%;border-left:0;border-top:0}
.vf .ln{position:absolute;left:18%;right:18%;height:2px;background:var(--amber);box-shadow:0 0 12px var(--amber);animation:scan 2.4s ease-in-out infinite alternate}
@keyframes scan{from{top:18%}to{top:80%}}
.vf p{margin:0;font-size:12.5px;text-align:center;padding:0 24px;position:relative;top:34%}
.rfid{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}
.res{border:1px solid var(--line);border-radius:12px;--c:var(--accent);border-top:4px solid var(--c)}
.big{font-family:var(--mono);font-size:26px;font-weight:600}
.bigbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.bigbtns .btn{min-height:50px;justify-content:center;font-size:15px}
/* alerts */
.warn{border:1.5px solid var(--c-over);background:color-mix(in srgb,var(--c-over) 8%,var(--card));border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.warn.amber{border-color:var(--c-wait);background:color-mix(in srgb,var(--c-wait) 9%,var(--card))}
.warn .ic{color:var(--c-over);margin-top:2px}.warn.amber .ic{color:var(--c-wait)}
.warn h4{font-size:15px}.warn p{margin:3px 0 0;color:var(--ink2)}
.sum{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px 0}
.sum button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left;min-width:110px}
.sum button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.sum b{font-size:20px;display:block;line-height:1.1}
/* approvals */
.apc{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);border-left:4px solid var(--c-wait)}
.apc .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-weight:500}
.route .ic{color:var(--mute)}
/* reports */
.rep{display:flex;flex-direction:column;gap:10px;padding:16px;height:100%}
.rep .ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.rep p{margin:0;color:var(--mute);font-size:12.5px;flex:1}
.chartbox{position:relative;height:270px}
/* modal / toast */
.ovl{position:fixed;inset:0;background:rgba(9,16,23,.58);display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:5vh 12px;z-index:80}
.ovl.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:min(580px,100%);box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal.wide{width:min(980px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.mh h3{font-size:17px}
.mb{padding:18px}.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.3);display:flex;gap:10px;align-items:flex-start;font-size:13px;border-left:4px solid var(--c-avail)}
.toast.warn2{border-left-color:var(--amber)}.toast.danger{border-left-color:#F26B6B}
.qrbox{display:grid;place-items:center;padding:14px;background:#fff;border-radius:10px;border:1px solid var(--line);width:fit-content;color:#111}
.tag{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:16px;align-items:center;background:var(--card)}
.id-banner{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:16px;border-left:4px solid var(--amber)}
.bnav,.qa{display:none}
.scrim{display:none}
@media (prefers-reduced-motion:reduce){.vf .ln,.fc::before{animation:none}}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1100px){
  .flow{flex-wrap:wrap;gap:10px}.fc{display:none}.fn{flex:1 1 150px}
  .g21,.g12,.g3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}.main{grid-column:1}
  .side{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.4)}.side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(9,16,23,.5);z-index:35}
  .g2{grid-template-columns:1fr}.clock{display:none}
}
@media (max-width:760px){
  .view{padding:14px 12px 96px}.top{padding:8px 12px}.kpis{grid-template-columns:repeat(2,1fr)}
  .user div{display:none}.user{padding:4px}
  .plant{grid-template-columns:repeat(2,1fr);grid-template-areas:none}.plant .room{grid-area:auto!important}
  .fgrid{grid-template-columns:1fr}.side-nodes{grid-template-columns:1fr 1fr}
  .btn{min-height:44px}.btn.sm{min-height:36px}.tools input,.tools select,.fld input,.fld select,.fld textarea{min-height:44px;font-size:16px}
  .ph h1{font-size:20px}.steps .step span{display:none}.step{min-width:96px}
  .qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .qa button{min-height:76px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
  .qa button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:45;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);cursor:pointer;position:relative}
  .bnav button.on{color:var(--accent);font-weight:600}
  .bnav .cnt{position:absolute;top:3px;left:56%;background:#C22B2B;color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px}
  .toasts{bottom:78px}.bigbtns{grid-template-columns:1fr}.tcards{grid-template-columns:1fr}.modal{margin:0}.ovl{padding:2vh 8px}
  .vf{aspect-ratio:16/10}
}

function logAudit(action,trolley,prev,next){DB.audit.unshift({id:'AU-'+(++DB.seq.au),ts:NOW(),user:me().name,role:ROLE,action,trolley:trolley||'',prev:prev==null?'':prev,next:next==null?'':next}); if(DB.audit.length>700)DB.audit.length=700}

function validateMove(m){
 const t=T(m.trolley), issues=[];
 if(!t) return {fatal:`Trolley ${m.trolley||''} is not registered. Check the ID or add it in Trolley Master.`};
 if(!t.active) return {fatal:`${t.id} is deactivated. Reactivate it in Trolley Master before moving it.`};
 if(!m.from||!m.to) return {fatal:'Choose both a From and a To location.'};
 if(m.from===m.to) return {fatal:'From and To location are the same. Choose a different destination.'};
 if(t.status==='In Transit'&&!m.receive) return {fatal:`${t.id} is already in transit to ${lname(t.dest)}. Receive it first.`};
 if(m.from!==t.loc) issues.push({kind:'Wrong location',msg:`System shows ${t.id} at ${lname(t.loc)}, but this movement starts from ${lname(m.from)}.`});
 const prod=m.product||t.product, qty=+m.qty||0;

  if(!p.allowed.includes(grp(m.to))) issues.push({kind:'Wrong location',msg:`${p.name} is not normally held at ${lname(m.to)}.`});
  if(!ACCEPTS[t.type].includes(p.cat)) issues.push({kind:'Wrong trolley',msg:`${t.type} is not meant for ${p.cat.toLowerCase()} items.`}); }

}

  if(+m.qty>0){ t.product=m.product||t.product; t.batch=PROD[t.product]?PROD[t.product].batch:''; t.qty=+m.qty; } else { t.product=null; t.batch=''; t.qty=0; t.flags=[]; }

/* QR */
function qrSvg(text,px){
 let n=0,dark=null;
 try{ if(typeof qrcode==='function'){const q=qrcode(0,'M');q.addData(text);q.make();n=q.getModuleCount();dark=(r,c)=>q.isDark(r,c);} }catch(e){n=0}
 if(!n){ n=25; let h=0; for(const ch of text)h=(h*31+ch.charCodeAt(0))|0; const R=rng(h), grid=[];
  for(let r=0;r<n;r++){grid[r]=[];for(let c=0;c<n;c++)grid[r][c]=R()>.5}
  const fin=(r0,c0,r,c)=>{const a=r-r0,b=c-c0;if(a<-1||a>7||b<-1||b>7)return null;if(a<0||a>6||b<0||b>6)return false;return a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4)};
  dark=(r,c)=>{for(const [r0,c0] of [[0,0],[0,n-7],[n-7,0]]){const f=fin(r0,c0,r,c);if(f!==null)return f}return grid[r][c]}; }
 const q=2, N=n+q*2; let d=''; for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(dark(r,c))d+=`M${c+q} ${r+q}h1v1h-1z`;
 return `<svg viewBox="0 0 ${N} ${N}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR code ${esc(text)}"><rect width="${N}" height="${N}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}

 return `<div class="ph"><div><h1>Know what moved, where it is, and when its location changed.</h1><p>One live view of every trolley across the plant — replacing paper registers and Excel sheets. <b style="color:var(--ink)">Identify. Locate. Track. Notify. Trace.</b></p></div><div class="acts">${allowed('scan')?`<button class="btn p" data-act="go" data-p="scan">${ico('scan')}Scan trolley</button>`:''}${hasPerm('movement')?`<button class="btn" data-act="go" data-p="movement">${ico('move')}Record movement</button>`:''}</div></div>

 </div>

/* ---------- Live tracking ---------- */
function liveFiltered(){ const f=UI.live, q=f.q.trim().toLowerCase();
 return DB.trolleys.filter(t=>{ if(!t.active)return false; const e=eff(t);
  if(f.status&&e!==f.status)return false; if(f.loc&&t.loc!==f.loc)return false; if(f.grp&&grp(t.loc)!==f.grp)return false; if(f.type&&t.type!==f.type)return false;
  if(q&&![t.id,t.type,lname(t.loc),t.loc,pname(t.product),t.operator,t.rfid,t.qr].join(' ').toLowerCase().includes(q))return false; return true; }).sort((a,b)=>b.lastMove-a.lastMove); }
function tagChips(t){ const ok=t.tag==='OK'; return `<span class="chip ${ok||t.tag==='RFID signal weak'?'g':'r'}">QR ${t.tag==='QR unreadable'?'unreadable':'ok'}</span> <span class="chip ${t.tag==='RFID signal weak'?'w':'g'}">RFID ${t.tag==='RFID signal weak'?'weak':'ok'}</span>`; }
function liveTable(list){
 if(!list.length) return empty('No trolleys match','Clear a filter or search for another ID.');
 return `<div class="tw"><table><thead><tr><th>Trolley ID</th><th>Type</th><th>Current location</th><th>Previous location</th><th>Product / material</th><th>Status</th><th>Last movement</th><th>Operator</th><th>RFID / QR</th></tr></thead><tbody>${list.map(t=>{const e=eff(t);return `<tr class="${e==='Overdue'?'late':''}"><td>${tid(t.id)}</td><td>${esc(t.type)}</td><td><b>${esc(lname(t.loc))}</b><div class="small muted mono">${t.loc}</div></td><td>${esc(lname(t.prevLoc))}</td><td>${t.product?`${esc(pname(t.product))}<div class="small muted">${t.qty} ${PROD[t.product].uom} · ${esc(t.batch)}</div>`:'<span class="muted">Empty</span>'}</td><td>${badge(e)}${t.status==='In Transit'?`<div class="small muted">to ${esc(lname(t.dest))}</div>`:''}${flagChips(t)?`<div style="margin-top:3px">${flagChips(t)}</div>`:''}</td><td class="nowrap">${tm(t.lastMove)}<div class="small muted">${ago(t.lastMove)}</div></td><td>${esc(t.operator)}</td><td class="nowrap">${tagChips(t)}</td></tr>`}).join('')}</tbody></table></div>`;
}
function liveCards(list){
 if(!list.length) return empty('No trolleys match','Clear a filter or search for another ID.');
 return `<div class="tcards">${list.map(t=>{const e=eff(t);return `<div class="tc" style="--c:var(--c-${SKEY[e]})" data-act="open" data-id="${t.id}"><div class="r1"><span class="id">${t.id}</span>${badge(e)}</div><div class="small muted" style="margin-top:2px">${esc(t.type)}</div><dl><dt>Now at</dt><dd><b>${esc(lname(t.loc))}</b></dd><dt>From</dt><dd>${esc(lname(t.prevLoc))}</dd><dt>Material</dt><dd>${t.product?esc(pname(t.product))+' × '+t.qty:'Empty'}</dd><dt>Moved</dt><dd>${tm(t.lastMove)} · ${ago(t.lastMove)}</dd><dt>Operator</dt><dd>${esc(t.operator)}</dd></dl><div style="margin-top:9px">${tagChips(t)}</div></div>`}).join('')}</div>`;
}
function liveRes(){ const l=liveFiltered(), size=UI.live.view==='cards'?24:20, pages=Math.max(1,Math.ceil(l.length/size)); if(UI.live.page>pages)UI.live.page=pages; const slice=l.slice((UI.live.page-1)*size,UI.live.page*size);
 return (UI.live.view==='cards'?liveCards(slice):liveTable(slice))+pager(l.length,UI.live.page,size,'live'); }
REFRESH.live=()=>{const el=$('#liveRes'); if(el)el.innerHTML=liveRes();};
PAGES.live=()=>{ const f=UI.live; const active=[f.status,f.grp&&('Group: '+f.grp)].filter(Boolean);

 <div class="card"><div class="tools"><input class="grow" data-ui="live.q" value="${esc(f.q)}" placeholder="Search by ID, product, operator, location" aria-label="Search trolleys">

/* ---------- Overdue ---------- */
PAGES.overdue=()=>{
 const list=DB.trolleys.filter(t=>t.active&&eff(t)==='Overdue').sort((a,b)=>a.expected-b.expected), now=NOW();
 const soon=DB.trolleys.filter(t=>t.active&&['In Use','Waiting'].includes(t.status)&&t.expected&&t.expected>now&&t.expected-now<30*MIN).sort((a,b)=>a.expected-b.expected);
 const worst=list[0];
 return `<div class="ph"><div><h1>Overdue trolleys</h1><p>Trolleys held past their expected return time. Each one is escalated by how long it is late.</p></div></div>
 ${list.length?`<div class="warn"><div>${ico('clock','lg')}</div><div><h4>${list.length} trolley${list.length>1?'s are':' is'} overdue</h4><p>Longest delay: ${tid(worst.id)} at ${esc(lname(worst.loc))}, late by <b>${dur(now-worst.expected)}</b>.</p></div></div>`:`<div class="warn amber" style="border-color:var(--c-avail)"><div>${ico('check','lg')}</div><div><h4>No overdue trolleys</h4><p>Every trolley is inside its expected return window.</p></div></div>`}
 <div class="card mt"><div class="ch"><h3>Overdue now</h3></div>${list.length?`<div class="tw"><table><thead><tr><th>Trolley ID</th><th>Current location</th><th>Expected return</th><th>Actual duration</th><th>Responsible department</th><th>Assigned person</th><th>Delay</th><th>Status</th><th></th></tr></thead><tbody>${list.map(t=>{const d=now-t.expected;return `<tr class="late"><td>${tid(t.id)}</td><td><b>${esc(lname(t.loc))}</b><div class="small muted mono">${t.loc}</div></td><td class="nowrap">${tm(t.expected)}<div class="small muted">${dt(t.expected)}</div></td><td class="nowrap">${dur(now-t.since)}</td><td>${esc(GDEPT[grp(t.loc)])}</td><td>${esc(t.operator)}</td><td class="nowrap" style="color:var(--c-over);font-weight:600">${ico('clock','sm')} ${dur(d)}</td><td>${badge('Overdue')}${d>2*HR?`<div class="small" style="color:var(--c-over)">Escalated</div>`:''}</td><td class="nowrap"><button class="btn sm" data-act="remind" data-id="${t.id}">Send reminder</button> ${hasPerm('movement')?`<button class="btn sm p" data-act="returnTrolley" data-id="${t.id}">Mark returned</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:empty('Nothing overdue','Trolleys that pass their expected return time will list here.')}</div>
 <div class="card mt"><div class="ch"><h3>Due back in the next 30 minutes</h3></div>${soon.length?`<div class="tw"><table><thead><tr><th>Trolley ID</th><th>Location</th><th>Expected return</th><th>Time left</th><th>Assigned person</th></tr></thead><tbody>${soon.map(t=>`<tr><td>${tid(t.id)}</td><td>${esc(lname(t.loc))}</td><td>${tm(t.expected)}</td><td>${dur(t.expected-now)}</td><td>${esc(t.operator)}</td></tr>`).join('')}</tbody></table></div>`:empty('No trolleys at risk','Nothing is due back in the next half hour.')}</div>`;
};
ACT.remind=el=>{const t=T(el.dataset.id);logAudit('Reminder sent',t.id,'',t.operator);save();toast(`Reminder sent to ${t.operator} for ${t.id}`)};
ACT.returnTrolley=el=>{const t=T(el.dataset.id); UI.mv.pre={trolley:t.id,type:'Production Return',from:t.loc,to:'STORE-01',qty:0}; go('movement')};

/* ---------- Trolley details ---------- */
function openTrolley(id){
 const t=T(id); if(!t){toast('Trolley not found','warn');return}
 const e=eff(t), ev=DB.movements.filter(r=>r.trolley===id&&r.status!=='Rejected').sort((a,b)=>a.ts-b.ts).slice(-8);
 const al=DB.alerts.filter(a=>a.trolley===id&&a.status!=='Resolved'), au=DB.audit.filter(a=>a.trolley===id).slice(0,5);
 const tl=ev.map((r,i)=>`<div class="ev ${i===ev.length-1?'now':''}"><b>${esc(lname(r.to))}</b><span>${esc(r.type)}${r.status!=='Completed'?` · ${esc(r.status)}`:''} · ${esc(r.operator)}</span><br><span>${dt(r.ts)}, ${tm(r.ts)}${r.from?` · from ${esc(lname(r.from))}`:''}</span></div>`).join('');
 const body=`<div class="grid g2"><div>
  <div class="tag"><div class="qrbox">${qrSvg(t.qr,92)}</div><div><div class="big">${t.id}</div><div style="margin:5px 0">${badge(e)} ${flagChips(t)}</div><div class="small muted mono">${t.qr}<br>${t.rfid}</div></div></div>
  <h4 style="margin:16px 0 8px">Trolley information</h4><dl class="kv"><dt>Type</dt><dd>${esc(t.type)}</dd><dt>Capacity</dt><dd>${t.capacity} kg</dd><dt>Material type</dt><dd>${esc(t.matType)}</dd><dt>Department</dt><dd>${esc(t.dept)}</dd><dt>Assigned area</dt><dd>${esc(lname(t.area))}</dd><dt>Current location</dt><dd><b>${esc(lname(t.loc))}</b> <span class="muted mono">${t.loc}</span></dd><dt>At location for</dt><dd>${dur(NOW()-t.since)}</dd><dt>Times used</dt><dd>${t.uses}</dd><dt>Tags</dt><dd>${tagChips(t)}</dd></dl>
  <h4 style="margin:16px 0 8px">Current assignment</h4>${t.product?`<dl class="kv"><dt>Product</dt><dd>${esc(pname(t.product))}</dd><dt>Batch number</dt><dd class="mono">${esc(t.batch)}</dd><dt>Quantity</dt><dd>${t.qty} ${PROD[t.product].uom}</dd><dt>Production line</dt><dd>${grp(t.loc)==='Production'?esc(lname(t.loc)):'—'}</dd><dt>Operator</dt><dd>${esc(t.operator)}</dd>${t.expected?`<dt>Expected return</dt><dd>${tm(t.expected)} ${e==='Overdue'?`<span class="chip r">${dur(NOW()-t.expected)} late</span>`:''}</dd>`:''}</dl>`:`<div class="muted">Empty. No product assigned. Last handled by ${esc(t.operator)}.</div>`}
  ${al.length?`<h4 style="margin:16px 0 8px">Open alerts</h4>${al.map(a=>`<div style="margin-bottom:6px">${prBadge(a.priority)} <b>${esc(a.type)}</b><div class="small muted">${esc(a.msg)}</div></div>`).join('')}`:''}
 </div><div><h4 style="margin-bottom:10px">Movement timeline</h4><div class="tl">${tl||'<span class="muted">No movements recorded.</span>'}</div>
  ${au.length?`<h4 style="margin:6px 0 8px">Recent audit entries</h4>${au.map(a=>`<div class="small" style="padding:5px 0;border-bottom:1px solid var(--line2)"><b>${esc(a.action)}</b> · ${esc(a.user)} · ${tm(a.ts)}<div class="muted">${esc(a.prev)}${a.next?' → '+esc(a.next):''}</div></div>`).join('')}`:''}</div></div>`;
 const foot=`${hasPerm('movement')?`<button class="btn p" data-act="moveFrom" data-id="${id}">${ico('move')}Move trolley</button>`:''}<button class="btn" data-act="issue" data-id="${id}">${ico('flag')}Report issue</button><button class="btn" data-act="qr" data-id="${id}">${ico('qr')}Generate QR</button>${hasPerm('master')?`<button class="btn" data-act="editT" data-id="${id}">${ico('edit')}Edit</button>`:''}`;
 openModal(`Trolley ${id}`,body,foot,true);
}

PAGES.master=()=>{ const f=UI.master, ed=hasPerm('master'), nid=nextId(), sample=DB.trolleys[0];
 return `<div class="ph"><div><h1>Trolley master</h1><p>The register of every trolley, each with one permanent ID, one QR label and one RFID tag.</p></div><div class="acts">${ed?`<button class="btn p" data-act="addT">${ico('plus')}Add trolley</button>`:''}</div></div>
 <div class="card id-banner"><div class="tag" style="border:0;padding:0"><div class="qrbox">${qrSvg(sample.qr,84)}</div><div><div class="big">${sample.id}</div><div class="small muted mono">${sample.qr}<br>${sample.rfid}</div></div></div><div style="flex:1;min-width:240px"><h3>One trolley, one identity</h3><p class="muted" style="margin:4px 0 0;max-width:62ch">Each trolley is registered once with a unique ID, bound to its QR label and RFID tag. IDs cannot be reused, even after a trolley is deactivated. The next free ID is <b class="mono" style="color:var(--ink)">${nid}</b>.</p></div><div style="display:flex;gap:18px"><div><div class="big">${DB.trolleys.length}</div><div class="small muted">unique IDs</div></div><div><div class="big">${DB.trolleys.filter(t=>t.active).length}</div><div class="small muted">active</div></div></div></div>
 <div class="card mt"><div class="tools"><input class="grow" data-ui="master.q" value="${esc(f.q)}" placeholder="Search by trolley ID, QR or RFID number" aria-label="Search master"><select data-ui="master.type" aria-label="Type"><option value="">All types</option>${TTYPES.map(s=>`<option ${f.type===s?'selected':''}>${s}</option>`).join('')}</select><select data-ui="master.status" aria-label="Status"><option value="">All statuses</option>${[...STATUSES,'Inactive'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select><select data-ui="master.dept" aria-label="Department"><option value="">All departments</option>${DEPTS.map(s=>`<option ${f.dept===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="masterRes">${masterRes()}</div></div>`; };
function trolleyForm(t){
 const add=!t; t=t||{id:nextId(),type:TTYPES[0],capacity:500,matType:'Raw Material',dept:'Stores',area:'STORE-01',rfid:'RFID-'+Math.floor(Math.random()*0xFFFFFFF+0x10000000).toString(16).toUpperCase(),loc:'STORE-01'};
 return `<form id="tf" class="fgrid" novalidate><input type="hidden" name="mode" value="${add?'add':'edit'}"><div class="fld"><label for="f1">Trolley ID</label><input id="f1" name="id" value="${t.id}" ${add?'':'disabled'} class="mono"><div class="hint">${add?'Format TR-### · must be unique':'IDs are permanent and cannot be changed'}</div></div>
 <div class="fld"><label>QR code</label><input value="QR-${t.id}" disabled class="mono"><div class="hint">Generated from the trolley ID</div></div>
 <div class="fld"><label for="f2">Trolley type</label><select id="f2" name="type">${TTYPES.map(x=>`<option ${t.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="fld"><label for="f3">Capacity (kg)</label><input id="f3" name="capacity" type="number" min="50" value="${t.capacity}"></div>
 <div class="fld"><label for="f4">Material type</label><select id="f4" name="matType">${['Raw Material','Component','WIP','Finished Goods','Rework'].map(x=>`<option ${t.matType===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="fld"><label for="f5">Department</label><select id="f5" name="dept">${DEPTS.map(x=>`<option ${t.dept===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="fld"><label for="f6">Assigned area</label><select id="f6" name="area">${locOpts(t.area)}</select></div>
 <div class="fld"><label for="f7">RFID number</label><input id="f7" name="rfid" value="${t.rfid}" class="mono"></div>
 ${add?`<div class="fld full"><label for="f8">Starting location</label><select id="f8" name="loc">${locOpts(t.loc)}</select></div>`:''}<div class="err full" id="tfErr"></div></form>`; }
ACT.addT=()=>openModal('Add trolley',trolleyForm(null),`<button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="saveT">Save trolley</button>`);
ACT.editT=el=>{closeModal();openModal('Edit trolley '+el.dataset.id,trolleyForm(T(el.dataset.id)),`<button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="saveT" data-id="${el.dataset.id}">Save changes</button>`)};
document.addEventListener('change',e=>{ if(e.target.name==='type'&&e.target.closest('#tf')){ const i=TINFO[e.target.value]; $('#tf [name=capacity]').value=i.cap; $('#tf [name=matType]').value=i.mat; } });
ACT.saveT=el=>{ const f=$('#tf'), v=Object.fromEntries(new FormData(f).entries()), err=m=>{$('#tfErr').textContent=m};
 if(v.mode==='add'){ const id=String(v.id||'').trim().toUpperCase(); if(!/^TR-\d{3,4}$/.test(id))return err('Trolley ID must look like TR-129.'); if(T(id))return err(`${id} already exists. Every trolley needs a unique ID.`);
  if(DB.trolleys.some(t=>t.rfid.toLowerCase()===v.rfid.trim().toLowerCase()))return err('That RFID number is already linked to another trolley.'); if(!(+v.capacity>0))return err('Enter a capacity above zero.');
  const now=NOW(); DB.trolleys.unshift({id,type:v.type,capacity:+v.capacity,matType:v.matType,dept:v.dept,area:v.area,qr:'QR-'+id,rfid:v.rfid.trim(),loc:v.loc,prevLoc:v.loc,dest:null,status:'Available',product:null,batch:'',qty:0,operator:me().name,created:now,lastMove:now,since:now,expected:null,active:true,uses:0,flags:[],tag:'OK'});
  DB.trolleys.sort((a,b)=>a.id.localeCompare(b.id)); logAudit('Trolley registered',id,'',lname(v.loc)); save(); closeModal(); toast(`${id} added with QR ${'QR-'+id}`); render(); ACT.qr({dataset:{id}}); }
 else { const t=T(el.dataset.id); if(DB.trolleys.some(x=>x.id!==t.id&&x.rfid.toLowerCase()===v.rfid.trim().toLowerCase()))return err('That RFID number is already linked to another trolley.'); if(!(+v.capacity>0))return err('Enter a capacity above zero.');
  [['type','Type'],['capacity','Capacity'],['matType','Material type'],['dept','Department'],['area','Assigned area'],['rfid','RFID']].forEach(([k,l])=>{const nv=k==='capacity'?+v[k]:String(v[k]).trim(); if(t[k]!==nv){logAudit('Trolley edited: '+l,t.id,String(t[k]),String(nv));t[k]=nv}}); save(); closeModal(); toast(t.id+' updated'); render(); }
};
ACT.toggleT=el=>{ const t=T(el.dataset.id); if(t.active){ if(t.qty>0||t.status==='In Transit'){ toast(`${t.id} still carries material or is in transit. Empty and receive it first.`,'warn'); return; }
  openModal('Deactivate trolley',`<p style="margin:0">Deactivate <b class="mono">${t.id}</b>? It will disappear from live tracking and cannot be moved. Its ID, QR and history stay on record.</p>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn d" data-act="doToggle" data-id="${t.id}">Deactivate</button>`); }
 else ACT.doToggle(el); };
ACT.doToggle=el=>{ const t=T(el.dataset.id); t.active=!t.active; logAudit(t.active?'Trolley activated':'Trolley deactivated',t.id,t.active?'Inactive':'Active',t.active?'Active':'Inactive'); save(); closeModal(); toast(`${t.id} ${t.active?'activated':'deactivated'}`); syncAlerts(); save(); render(); };

/* ---------- Scan ---------- */
function scanResHtml(){ const s=UI.scan.res;
 if(!s) return `<div class="empty">${ico('scan','lg')}<div style="margin-top:8px"><b style="color:var(--ink)">Waiting for a scan</b></div><div>Scan a QR label or RFID tag, or type the trolley ID. Details and actions appear here.</div></div>`;
 if(s.err) return `<div class="warn" style="margin:16px"><div>${ico('warn','lg')}</div><div><h4>Trolley not found</h4><p>No trolley matches “${esc(s.err)}”. Check the ID, or register it in Trolley Master.</p></div></div>`;
 const t=T(s.id), e=eff(t); const can=hasPerm('movement');
 return `<div class="res" style="--c:var(--c-${SKEY[e]})"><div style="padding:16px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><div class="small muted">Identified by ${s.src}</div><div class="big">${t.id}</div></div>${badge(e)}</div>
 <dl class="kv" style="margin-top:12px"><dt>Current location</dt><dd><b>${esc(lname(t.loc))}</b> <span class="muted mono small">${t.loc}</span></dd><dt>Current status</dt><dd>${esc(e)}${t.status==='In Transit'?` to ${esc(lname(t.dest))}`:''}</dd><dt>Assigned material</dt><dd>${t.product?`${esc(pname(t.product))} × ${t.qty}`:'Empty'}</dd><dt>Last movement</dt><dd>${tm(t.lastMove)} · ${ago(t.lastMove)}</dd><dt>Last operator</dt><dd>${esc(t.operator)}</dd><dt>At location for</dt><dd>${dur(NOW()-t.since)}</dd></dl>${flagChips(t)?`<div style="margin-top:10px">${flagChips(t)}</div>`:''}</div>
 <div style="padding:0 16px 16px"><div class="bigbtns">${can?`<button class="btn p" data-act="moveFrom" data-id="${t.id}">${ico('move')}Move trolley</button><button class="btn" data-act="receive" data-id="${t.id}">${ico('inbox')}Receive trolley</button>`:''}<button class="btn" data-act="issue" data-id="${t.id}">${ico('flag')}Report issue</button><button class="btn" data-act="open" data-id="${t.id}">${ico('history')}View history</button></div></div></div>`; }
REFRESH.scan=()=>{const el=$('#scanRes'); if(el)el.innerHTML=scanResHtml(); const r=$('#recent'); if(r)r.innerHTML=recentHtml();};
const recentHtml=()=>UI.scan.recent.length?UI.scan.recent.slice(0,5).map(r=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2)"><span>${r.id?tid(r.id):`<span class="muted">${esc(r.q)}</span>`}</span><span class="small muted">${r.src} · ${tm(r.at)}</span></div>`).join(''):'<div class="small muted">No scans yet in this session.</div>';
function doScan(code,src){ const t=lookup(code); UI.scan.res=t?{id:t.id,src}:{err:String(code).trim()}; UI.scan.recent.unshift({id:t&&t.id,q:code,src,at:NOW()}); REFRESH.scan(); const r=$('#scanRes'); if(r&&matchMedia('(max-width:900px)').matches)r.scrollIntoView({behavior:'smooth',block:'start'}); }
PAGES.scan=()=>`<div class="ph"><div><h1>Scan trolley</h1><p>Identify a trolley from its QR label or RFID tag and see where it is straight away.</p></div></div>${flow([0,1])}
 <div class="grid g2"><div class="card"><div class="cb"><div class="vf" aria-label="QR scanner preview"><i class="c a"></i><i class="c b"></i><i class="c c2"></i><i class="c d"></i><i class="ln"></i><p>${ico('qr','lg')}<br>Point the camera at the QR label.<br><span class="small">Camera preview is a placeholder in this prototype.</span></p></div>
  <div class="rfid" style="margin-top:12px"><span class="dotg"></span><div style="flex:1"><b>RFID reader RG-03 connected</b><div class="small muted">Handheld reader ready · 4 of 4 gate antennas online</div></div>${ico('rfid')}</div>
  <form id="scanForm" style="display:flex;gap:8px;margin-top:12px"><div class="fld" style="flex:1"><input id="scanIn" placeholder="Enter trolley ID, e.g. TR-018" aria-label="Trolley ID" autocomplete="off" class="mono"></div><button class="btn p" type="submit">${ico('scan')}Scan</button></form>
  <div class="acts" style="margin-top:10px"><button class="btn" data-act="simQr">${ico('qr')}Simulate QR scan</button><button class="btn" data-act="simRfid">${ico('rfid')}Simulate RFID read</button></div>
  <h4 style="margin:16px 0 4px">Recent scans</h4><div id="recent">${recentHtml()}</div></div></div>
 <div class="card" id="scanRes">${scanResHtml()}</div></div>`;
AFTER.scan=()=>{ $('#scanForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#scanIn').value; if(!v.trim()){toast('Enter a trolley ID first','warn');return} doScan(v,'manual entry'); $('#scanIn').select();}); };
const rndT=()=>{const a=DB.trolleys.filter(t=>t.active);return a[Math.floor(Math.random()*a.length)]};
ACT.simQr=()=>{const t=rndT();$('#scanIn').value=t.qr;doScan(t.qr,'QR scan')};
ACT.simRfid=()=>{const t=rndT();$('#scanIn').value=t.rfid;doScan(t.rfid,'RFID read')};
function openReceive(id){
 const tr=DB.trolleys.filter(t=>t.active&&t.status==='In Transit'); if(id&&!tr.some(t=>t.id===id)){ const t=T(id); openModal('Receive trolley',`<p style="margin:0"><b class="mono">${id}</b> is not in transit. It is recorded at <b>${esc(lname(t.loc))}</b> with status ${esc(eff(t))}. To change its location, record a movement.</p>`,`<button class="btn" data-act="closeModal">Close</button><button class="btn p" data-act="moveFrom" data-id="${id}">Record movement</button>`); return; }
 if(!tr.length){ openModal('Receive trolley',empty('Nothing to receive','No trolleys are in transit right now.'),`<button class="btn" data-act="closeModal">Close</button>`); return; }
 openModal('Receive trolley',`<div class="fld"><label for="rcv">Trolley in transit</label><select id="rcv">${tr.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${t.id} · ${lname(t.loc)} → ${lname(t.dest)}</option>`).join('')}</select><div class="hint">Confirming records arrival at the destination and completes the movement.</div></div><div class="fld mt"><label for="rcvOp">Received by</label><input id="rcvOp" value="${esc(me().name)}" list="opl"></div><datalist id="opl">${OPS.map(o=>`<option value="${o}">`).join('')}</datalist>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="confirmReceive">${ico('inbox')}Confirm receipt</button>`); }
ACT.receive=el=>openReceive(el.dataset.id);
ACT.confirmReceive=()=>{ const id=$('#rcv').value, r=receiveTrolley(id,$('#rcvOp').value||me().name); closeModal(); if(r.ok){toast(`${id} received at ${lname(r.to)}`); if(UI.scan.res&&UI.scan.res.id===id)REFRESH.scan(); afterChange();} };
const ISSUES={'Damaged wheel or frame':['Trolley maintenance due','Medium'],'Tag unreadable (QR or RFID)':['Trolley maintenance due','Low'],'Trolley missing from its location':['Trolley missing','High'],'Wrong trolley at this location':['Wrong location','Medium'],'Wrong product loaded':['Wrong product','High']};
ACT.issue=el=>{ const id=el.dataset.id; openModal('Report issue · '+id,`<div class="fld"><label for="isT">What is wrong?</label><select id="isT">${Object.keys(ISSUES).map(k=>`<option>${k}</option>`).join('')}</select></div><div class="fld mt"><label for="isN">Details</label><textarea id="isN" rows="3" placeholder="What did you see?"></textarea></div>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="sendIssue" data-id="${id}">Report issue</button>`); };
ACT.sendIssue=el=>{ const id=el.dataset.id,k=$('#isT').value,[type,pr]=ISSUES[k], note=$('#isN').value.trim(); const a=raiseAlert({type,trolley:id,loc:T(id).loc,priority:pr,msg:k+(note?': '+note:'')+` (reported by ${me().name})`}); closeModal(); if(a){save();toast(`Issue reported for ${id}`);chrome();} else toast(`An open “${type}” alert already exists for ${id}`,'warn'); };
function openLocate(){ openModal('Current location',`<div class="fld"><label for="lcIn">Trolley ID</label><input id="lcIn" class="mono" placeholder="TR-018" autocomplete="off"></div><div id="lcOut" class="mt"></div>`,`<button class="btn" data-act="closeModal">Close</button><button class="btn p" data-act="doLocate">${ico('pin')}Find trolley</button>`); $('#lcIn').addEventListener('keydown',e=>{if(e.key==='Enter')ACT.doLocate()}); }
ACT.locate=openLocate;
ACT.doLocate=()=>{ const t=lookup($('#lcIn').value); $('#lcOut').innerHTML=t?`<div class="res" style="--c:var(--c-${SKEY[eff(t)]});padding:14px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="big">${t.id}</div>${badge(eff(t))}</div><div style="margin-top:8px;font-size:17px"><b>${esc(lname(t.loc))}</b></div><div class="muted">${t.product?esc(pname(t.product))+' × '+t.qty:'Empty'} · moved ${ago(t.lastMove)} by ${esc(t.operator)}</div></div>`:`<div class="err">No trolley matches that ID.</div>`; };
/* ====================== PAGES: movement / locations / history / products ====================== */
const MSK={'Completed':'avail','In Transit':'transit','Pending Approval':'wait','Rejected':'over','Correction Requested':'wait','Approved':'avail','Pending':'wait'};
const sbadge=s=>`<span class="bd s-${MSK[s]||'off'}">${esc(s)}</span>`;
let PENDING_M=null;

/* ---------- Movement entry ---------- */
const mvTypes=()=>ROLES[ROLE].types||MTYPES;
function recentMoves(n){ return DB.movements.filter(r=>r.status!=='Pending Approval').slice(0,n).map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line2)"><div style="display:flex;justify-content:space-between;gap:8px">${tid(r.trolley)}<span class="small muted">${tm(r.ts)}</span></div><div class="small">${esc(lname(r.from))} → ${esc(lname(r.to))}</div><div class="small muted">${esc(r.type)} · ${esc(r.operator)}</div></div>`).join(''); }
PAGES.movement=()=>{
 if(!hasPerm('movement')) return `<div class="ph"><div><h1>Record trolley movement</h1></div></div>${empty('Your role cannot record movements','Switch to Operator, Supervisor, Quality or Store user to record a movement.')}`;
 const d=new Date(), pd=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'), pt=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 const l=UI.mv.last;
 return `<div class="ph"><div><h1>Record trolley movement</h1><p>Scan or enter the trolley, choose where it is going and confirm. The location, status, history and dashboard counts update straight away.</p></div></div>${flow([2,3])}
 ${l?`<div class="warn ${l.pending?'amber':''}" style="${l.pending?'':'border-color:var(--c-avail);background:color-mix(in srgb,var(--c-avail) 9%,var(--card))'};margin-bottom:16px"><div>${ico(l.pending?'shield':'check','lg')}</div><div><h4>${l.pending?'Sent for supervisor approval':'Movement recorded'}</h4><p>${tid(l.trolley)} ${esc(lname(l.from))} → ${esc(lname(l.to))}. ${l.pending?'The trolley stays where it is until a supervisor approves.':`${esc(lname(l.from))} now holds ${l.fromAfter} trolleys; ${esc(lname(l.to))} holds ${l.toAfter}.`}</p></div></div>`:''}
 <div class="grid g21"><form class="card" id="mvForm" novalidate><div class="ch"><h3>Movement details</h3></div><div class="cb"><div class="fgrid">
  <div class="fld"><label for="m1">Trolley ID</label><input id="m1" name="trolley" list="tl" class="mono" placeholder="TR-001" autocomplete="off" required><datalist id="tl">${DB.trolleys.filter(t=>t.active).map(t=>`<option value="${t.id}">`).join('')}</datalist></div>
  <div class="fld"><label for="m2">Movement type</label><select id="m2" name="type">${mvTypes().map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div class="fld"><label for="m3">From location</label><select id="m3" name="from">${locOpts('','Select location')}</select></div>
  <div class="fld"><label for="m4">To location</label><select id="m4" name="to">${locOpts('','Select location')}</select></div>
  <div class="fld"><label for="m5">Product / material</label><select id="m5" name="product">${prodOpts('','No product (empty trolley)')}</select></div>
  <div class="fld"><label for="m6">Quantity</label><input id="m6" name="qty" type="number" min="0" value="0"></div>
  <div class="fld"><label for="m7">Operator name</label><input id="m7" name="operator" list="opl" value="${esc(me().name)}"><datalist id="opl">${OPS.map(o=>`<option value="${o}">`).join('')}</datalist></div>
  <div class="fld"><label for="m8">Department</label><select id="m8" name="dept">${DEPTS.map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div class="fld"><label for="m9">Movement date</label><input id="m9" name="date" type="date" value="${pd}"></div>
  <div class="fld"><label for="m10">Movement time</label><input id="m10" name="time" type="time" value="${pt}"></div>
  <div class="fld"><label for="m11">Reason</label><input id="m11" name="reason" list="rsl" placeholder="Why is it moving?"><datalist id="rsl"><option value="Line replenishment"><option value="Inspection hold"><option value="Inspection passed"><option value="Ready for packing"><option value="Customer order dispatch"><option value="Return empty trolley"><option value="Scheduled service"><option value="Job work at vendor"></datalist></div>
  <div class="fld"><label for="m12">Status after movement</label><select id="m12" name="statusAfter"><option value="auto">Set automatically</option>${['Available','In Use','Waiting','Maintenance','Outside Plant'].map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div class="fld full"><label for="m13">Remarks</label><textarea id="m13" name="remarks" rows="2" placeholder="Optional"></textarea></div>
  <div class="fld full"><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="transit" style="width:auto;min-height:0"> Mark as in transit. The trolley stays at the origin until someone receives it at the destination.</label></div>
 </div></div><div class="mf" style="justify-content:flex-start"><button class="btn p" type="submit" id="mvGo">${ico('check')}Confirm movement</button><button class="btn" type="button" data-act="mvCancel">Cancel</button></div></form>
 <div><div class="card"><div class="ch"><h3>Verify before you confirm</h3></div><div class="cb" id="mvPrev"><div class="muted">Enter a trolley ID to see its current location, assigned material and any exceptions.</div></div></div><div class="card mt"><div class="ch"><h3>Latest movements</h3></div><div class="cb">${recentMoves(5)}</div></div></div></div>`;
};
function mvRead(){ const f=$('#mvForm'); if(!f)return null; const v=Object.fromEntries(new FormData(f).entries()); v.transit=!!f.elements.transit.checked; v.qty=+v.qty||0; v.trolley=String(v.trolley||'').trim().toUpperCase(); const ts=new Date((v.date||'')+'T'+(v.time||'00:00')).getTime(); v.ts=isNaN(ts)?NOW():ts; return v; }
function mvPreview(){ const v=mvRead(); if(!v)return; const el=$('#mvPrev'); const t=T(v.trolley); if(!v.trolley){el.innerHTML='<div class="muted">Enter a trolley ID to see its current location, assigned material and any exceptions.</div>';return}
 if(!t){el.innerHTML=`<div class="err">No trolley is registered as ${esc(v.trolley)}.</div>`;return}
 const r=validateMove(v), e=eff(t); let h=`<div style="display:flex;justify-content:space-between;align-items:center"><div class="big" style="font-size:22px">${t.id}</div>${badge(e)}</div><dl class="kv" style="margin-top:8px"><dt>Now at</dt><dd><b>${esc(lname(t.loc))}</b></dd><dt>Carrying</dt><dd>${t.product?esc(pname(t.product))+' × '+t.qty:'Empty'}</dd><dt>Last moved</dt><dd>${ago(t.lastMove)} by ${esc(t.operator)}</dd></dl>`;
 if(r.fatal) h+=`<div class="err" style="margin-top:10px">${esc(r.fatal)}</div>`;

 ['from','product','qty','transit'].forEach(n=>sel(n).addEventListener('change',mvPreview)); sel('qty').addEventListener('input',mvPreview);
 const p=UI.mv.pre; if(p){ sel('trolley').value=p.trolley||''; fillFromTrolley(); if(p.type){sel('type').value=p.type;} if(p.from)sel('from').value=p.from; if(p.to){sel('to').value=p.to;sel('dept').value=GDEPT[grp(p.to)];} if(p.qty!=null){sel('qty').value=p.qty; if(+p.qty===0)sel('product').value='';} UI.mv.pre=null; mvPreview(); }
 UI.mv.last=null;
 f.addEventListener('submit',e=>{ e.preventDefault(); const m=mvRead(); if(!m.trolley)return toast('Enter a trolley ID','warn'); if(!m.type)return toast('Choose a movement type','warn');
  if(!m.operator||!m.operator.trim())return toast('Enter the operator name','warn');

  if(issues.length||outside){ PENDING_M=m; const all=[...(outside?[{kind:'Outside plant',msg:`${m.trolley} is leaving the plant. A supervisor must approve outside plant movements.`}]:[]),...issues];

  <h4 style="margin:18px 0 8px">Appearance</h4><div class="acts">${['auto','light','dark'].map(x=>`<button class="btn sm ${th===x?'p':''}" data-act="theme" data-v="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
  <h4 style="margin:18px 0 8px">Demo data</h4><p class="muted small" style="margin:0 0 8px">Everything is stored in this browser. Reset restores the 128-trolley sample plant.</p><button class="btn d" data-act="resetData">Reset demo data</button></div></div>
 <div class="card"><div class="ch"><h3>Roles and access</h3></div><div class="tw"><table><thead><tr><th>Role</th><th>Can do</th><th>Pages</th></tr></thead><tbody>${Object.keys(ROLES).map(r=>`<tr><td><b>${r}</b><div class="small muted">${USERS[r]}</div></td><td class="small" style="max-width:34ch">${ROLES[r].blurb}</td><td class="small">${ROLES[r].pages.length} of ${ALL_PAGES.length}</td></tr>`).join('')}</tbody></table></div></div></div>
 <div class="card mt"><div class="ch"><h3>Audit trail</h3><span class="small muted">Who changed what, and when</span></div><div class="tools"><input class="grow" data-ui="audit.q" value="${esc(UI.audit.q)}" placeholder="Search by trolley, user or action" aria-label="Search audit"></div><div id="auditRes">${auditRes()}</div></div>`; };
ACT.setting=el=>{DB.settings[el.dataset.k]=el.checked;logAudit('Setting changed',el.dataset.k,String(!el.checked),String(el.checked));save();toast('Setting saved')};
ACT.theme=el=>{ const v=el.dataset.v; try{localStorage.setItem('stms-theme',v)}catch(e){} applyTheme(v); render(); };
function applyTheme(v){ if(v==='auto')document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); }
ACT.resetData=()=>openModal('Reset demo data',`<p style="margin:0">This replaces everything with the original sample plant: 128 trolleys, movements, alerts and approvals. Your changes will be lost.</p>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn d" data-act="doReset">Reset</button>`);
ACT.doReset=()=>{ initDB(true); UI.scan.res=null; UI.mv.last=null; closeModal(); toast('Demo data restored'); render(); };

/* ---------- init ---------- */
(function init(){
 try{applyTheme(localStorage.getItem('stms-theme')||'auto')}catch(e){}
 initDB(false);
 const p=(location.hash||'').replace('#/',''); CUR=PAGES[p]&&allowed(p)?p:'dashboard';
 render();
 setInterval(()=>{ syncAlerts(); save(); refreshAll(); },30000);
 window.addEventListener('resize',()=>chrome());
})();
</script>
</body>
